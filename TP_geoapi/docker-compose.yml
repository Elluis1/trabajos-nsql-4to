services:
  backend:
    build:
      context: ./backdjango
    container_name: tp-django-backend-geoapi
    volumes:
      - ./backdjango:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis
    command: python manage.py runserver 0.0.0.0:8000

  frontend:
    image: node:18
    container_name: tp-angular-frontend-geoapi
    working_dir: /app
    volumes:
      - ./frontangular/geoapiview:/app
    ports:
      - "4200:4200"
    command: >
      sh -c "npm install && npx ng serve --host 0.0.0.0"

  redis:
    image: redis:7
    container_name: tp-redis-geoapi
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  redisdata:
